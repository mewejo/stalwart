# Fork-only workflow: runs the IMAP integration test the same way as
# test.yml (STORE=RocksDb), on every pull request in this fork.
name: IMAP tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imap:
    name: IMAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STORE: RocksDb
      RUST_MIN_STACK: "16777216"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Style
        run: cargo fmt --all --check

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: IMAP Tests
        run: cargo test -p tests imap_tests -- --nocapture
